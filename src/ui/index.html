<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Shuggle</title>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="stylesheet" href="/vendor/highlight-theme.css"/>
<link rel="stylesheet" href="/style.css"/>
</head>
<body>
  <div id="app">
    <!-- ============ gate (create account / login) ============ -->
    <div id="gate" class="gate hidden">
      <div class="gate-card">
        <div class="gate-logo">
          <img src="/favicon.png" alt="" width="64" height="64"/>
          <h1>Shuggle</h1>
          <p class="gate-sub">Free chats on free GPUs. Uncensored, private, yours.</p>
        </div>
        <div id="gate-create" class="hidden">
          <p class="gate-hint">First device setup — one account lives on this device.</p>
          <label class="field"><span>Account name</span>
            <input id="gate-name" type="text" autocomplete="off" spellcheck="false" placeholder="pick a name" maxlength="32"/>
          </label>
          <label class="field"><span>Password</span>
            <input id="gate-pass" type="password" placeholder="make it a good one"/>
          </label>
          <label class="field"><span>Confirm password</span>
            <input id="gate-pass2" type="password"/>
          </label>
          <button id="gate-create-btn" class="btn primary wide">Create account</button>
        </div>
        <div id="gate-login" class="hidden">
          <p class="gate-hint">Welcome back, <b id="gate-account-name"></b>.</p>
          <label class="field"><span>Password</span>
            <input id="gate-login-pass" type="password" placeholder="your password"/>
          </label>
          <button id="gate-login-btn" class="btn primary wide">Unlock</button>
          <p class="gate-note">One account per device — your chats, tokens and memories stay in the app folder, encrypted with this password.</p>
        </div>
        <p id="gate-error" class="gate-error hidden"></p>
      </div>
    </div>

    <!-- ============ main shell ============ -->
    <div id="shell" class="shell hidden">
      <!-- sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="brand">
          <img src="/favicon.png" alt="" width="26" height="26"/>
          <span class="brand-name">Shuggle</span>
          <span id="engine-chip" class="engine-chip idle" title="">idle</span>
        </div>
        <button id="new-chat" class="btn new-chat">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          New chat
        </button>
        <div class="side-search">
          <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="chat-search" type="text" placeholder="Search chats" autocomplete="off"/>
        </div>
        <nav id="chat-list" class="chat-list"></nav>
        <div class="side-foot">
          <button id="btn-tokens" class="side-icon" title="Kaggle tokens">
            <svg viewBox="0 0 24 24" width="17" height="17"><rect x="2" y="5" width="20" height="14" rx="3" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="8" cy="12" r="2.2" fill="currentColor"/><path d="M14 10h5M14 14h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button id="btn-memory" class="side-icon" title="Memories">
            <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 3a7 7 0 0 0-4 12.7V19a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-3.3A7 7 0 0 0 12 3z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M10 21h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button id="btn-settings" class="side-icon" title="Settings">
            <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.1 5.1l2.1 2.1M16.8 16.8l2.1 2.1M18.9 5.1l-2.1 2.1M7.2 16.8l-2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <div class="foot-account" id="foot-account" title=""></div>
          <button id="btn-lan" class="side-icon" title="Share on your local network">
            <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="12" cy="5" r="2.5" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="5" cy="19" r="2.5" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="19" cy="19" r="2.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 7.5v4M12 11.5L6.5 17M12 11.5l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </aside>

      <!-- chat pane -->
      <main id="main" class="main">
        <header class="topbar">
          <div class="top-title" id="top-title">Shuggle</div>
          <div class="top-actions">
            <button class="chip-toggle" id="toggle-search" title="Let it search the web for fresh info">
              <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              Search
            </button>
            <button class="chip-toggle" id="toggle-think" title="Show the model's thinking as it works">
              <svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 21h6M10 17h4a5.5 5.5 0 1 0-5.7-9.2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M12 3v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              Thinking
            </button>
            <button class="chip-toggle" id="toggle-memory" title="Share your memories with this chat">
              <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 3a7 7 0 0 0-4 12.7V19a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-3.3A7 7 0 0 0 12 3z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
              Memory
            </button>
            <button class="chip-toggle" id="toggle-vision" title="Let this chat see images and videos">
              <svg viewBox="0 0 24 24" width="14" height="14"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="2" fill="none"/></svg>
              Vision
            </button>
            <button class="chip-toggle" id="toggle-compare" title="Compare two chats side by side">
              <svg viewBox="0 0 24 24" width="14" height="14"><rect x="3" y="4" width="7.5" height="16" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/><rect x="13.5" y="4" width="7.5" height="16" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
              Compare
            </button>
            <button class="chip-toggle" id="btn-chat-settings" title="Chat settings (apply to this chat only)">
              <svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h10M18 17h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="currentColor"/><circle cx="8" cy="12" r="2" fill="currentColor"/><circle cx="16" cy="17" r="2" fill="currentColor"/></svg>
              Chat settings
            </button>
            <button class="chip-toggle" id="btn-export" title="Download this chat">
              <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 4v10M8 10l4 4 4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
        </header>
        <div id="thread" class="thread"></div>
        <div class="composer-wrap">
          <div id="engine-banner" class="engine-banner hidden"></div>
          <div id="attach-row" class="attach-row hidden"></div>
          <div class="composer">
            <button id="btn-attach" class="composer-icon" title="Attach UTF-8 text files">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 11l-7.6 7.6a4.6 4.6 0 0 1-6.5-6.5L13.4 4.6a3.1 3.1 0 0 1 4.4 4.4l-7.5 7.5a1.6 1.6 0 0 1-2.2-2.2l6.9-6.9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
            </button>
            <button id="btn-image" class="composer-icon" title="Add an image">
              <svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="4" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path d="M5 18.5l5-5 3.5 3.5 3-3 2.5 2.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="btn-video" class="composer-icon" title="Add a video (it reads frames from it)">
              <svg viewBox="0 0 24 24" width="18" height="18"><rect x="2.5" y="5" width="14" height="14" rx="2.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16.5 10.5l5-3v9l-5-3" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
            </button>
            <textarea id="input" rows="1" placeholder="Say anything…  (Shift+Enter for a new line)"></textarea>
            <button id="btn-send" class="btn send" title="Send">
              <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 19V6M6 11l6-6 6 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="btn-stop" class="btn send stop hidden" title="Stop and rest the engine">
              <svg viewBox="0 0 24 24" width="15" height="15"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>
            </button>
          </div>
          <div class="composer-hint" id="composer-hint"></div>
        </div>
      </main>
    </div>

    <!-- ============ modals ============ -->
    <div id="modal-root" class="modal-root hidden"></div>
    <div id="toast-root" class="toast-root"></div>
    <input id="file-input" type="file" multiple class="hidden"/>
    <input id="media-input" type="file" multiple accept="image/*,video/*" class="hidden"/>
  </div>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>

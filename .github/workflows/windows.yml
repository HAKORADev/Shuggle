name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8.1
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ""

      - name: Get WebView2 SDK (nuget)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path webview2 | Out-Null
          $url = "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2"
          Invoke-WebRequest -Uri $url -OutFile webview2\pkg.zip
          Expand-Archive -Path webview2\pkg.zip -DestinationPath webview2\pkg
          echo "WEBVIEW2_DIR=$PWD\webview2\pkg" >> $env:GITHUB_ENV

      - name: Configure (MSVC)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHUGGLE_BUILD_GUI=ON ^
            -DCMAKE_CXX_FLAGS="/permissive- /Zc:__cplusplus" ^
            -DSHUGGLE_WEBVIEW2_INCLUDE="%WEBVIEW2_DIR%\build\native\include" ^
            -DSHUGGLE_WEBVIEW2_LIB="%WEBVIEW2_DIR%\build\native\x64"

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          ninja -C build

      - name: Stage artifact (windeployqt, single folder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item build\shuggle.exe stage\
          Copy-Item build\shuggle-cli.exe stage\
          windeployqt --no-translations --no-system-d3d-compiler --no-opengl-sw `
            --exclude-plugins qmltooling,sceneparsers,position,sensors,webview `
            stage\shuggle.exe
          Remove-Item stage\*.qml -ErrorAction SilentlyContinue
          Get-ChildItem stage -Recurse -Include *.qml,*d.dll | Remove-Item -ErrorAction SilentlyContinue

      - name: Smoke test (CLI)
        shell: pwsh
        run: |
          & stage\shuggle-cli.exe version
          & stage\shuggle-cli.exe | Select-Object -First 5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuggle-windows
          path: stage/

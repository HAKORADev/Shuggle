name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8.1
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Install curl via vcpkg (preinstalled on runners)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install curl:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Get WebView2 SDK (nuget)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path webview2 | Out-Null
          $url = "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2"
          Invoke-WebRequest -Uri $url -OutFile webview2\pkg.zip
          Expand-Archive -Path webview2\pkg.zip -DestinationPath webview2\pkg
          echo "WEBVIEW2_INC=$PWD\webview2\pkg\build\native\include" >> $env:GITHUB_ENV
          echo "WEBVIEW2_LIB=$PWD\webview2\pkg\build\native\x64" >> $env:GITHUB_ENV

      - name: Configure (MSVC + vcpkg toolchain)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHUGGLE_BUILD_GUI=ON ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DSHUGGLE_WEBVIEW2_INCLUDE="%WEBVIEW2_INC%" ^
            -DSHUGGLE_WEBVIEW2_LIB="%WEBVIEW2_LIB%"

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          ninja -C build

      - name: Stage artifact (single folder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item build\shuggle.exe stage\
          Copy-Item build\shuggle-cli.exe stage\
          # Qt deployment
          windeployqt --no-translations --no-system-d3d-compiler --no-opengl-sw `
            --exclude-plugins qmltooling,sceneparsers,position,sensors `
            stage\shuggle.exe
          # curl + deps from vcpkg
          $vbin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          Get-ChildItem $vbin -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName stage\ -ErrorAction SilentlyContinue
          }
          Get-ChildItem stage -Recurse -Include *d.dll | Where-Object { $_.Name -match 'd\.dll$' -and $_.Name -notmatch 'Qt6' } | Remove-Item -ErrorAction SilentlyContinue

      - name: Smoke test (CLI)
        shell: pwsh
        run: |
          & stage\shuggle-cli.exe version
          & stage\shuggle-cli.exe | Select-Object -First 5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuggle-windows
          path: stage/

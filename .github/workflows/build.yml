name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Bundle UI
        run: bun build src/ui/app.ts --minify --format=iife --outfile=src/ui/app.bundle.js
      - name: Compile single binary
        run: bun build src/shuggle.ts --compile --minify --outfile=shuggle
      - name: Smoke test (dispatch + no-crash startup paths)
        run: |
          ./shuggle version
          ./shuggle help | head -5
          ./shuggle status
      - name: Prepare folder (binary + launchers)
        run: |
          mkdir -p bundle
          cp shuggle bundle/
          cp launcher/shuggle.sh bundle/
          cp launcher/shuggle-lan.sh bundle/
          chmod +x bundle/shuggle bundle/*.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuggle-linux-x64
          path: bundle/
          compression-level: 9

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Bundle UI
        run: bun build src/ui/app.ts --minify --format=iife --outfile=src/ui/app.bundle.js
      - name: Compile single binary
        shell: bash
        # console-subsystem exe: `Shuggle.exe cli` keeps real stdio; GUI mode
        # hides its own console window at startup (see src/shuggle.ts)
        run: bun build src/shuggle.ts --compile --minify --windows-icon=assets/shuggle.ico --windows-title="Shuggle" --windows-publisher="HAKORA" --windows-version="0.5.0.0" --windows-description="Free chats on free GPUs" --outfile=Shuggle.exe
      - name: Smoke test (dispatch + no-crash startup paths)
        shell: bash
        run: |
          ./Shuggle.exe version
          ./Shuggle.exe help | head -5
          ./Shuggle.exe status
      - name: Prepare folder (exe + Windows launchers only)
        shell: bash
        run: |
          mkdir -p bundle
          cp Shuggle.exe bundle/
          cp launcher/"Shuggle.bat" bundle/
          cp launcher/"Shuggle CLI.bat" bundle/
          cp launcher/"Shuggle LAN.bat" bundle/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuggle-windows-x64
          path: bundle/
          compression-level: 9

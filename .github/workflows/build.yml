name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test tests/core.test.ts tests/engine.test.ts
      # The UI bundle must exist before the binary is compiled — the app
      # embeds it (a single-file build has no src/ui folder on disk).
      - name: Bundle UI
        run: bun run build:ui
      - name: Compile single binary
        run: bun build src/shuggle.ts --compile --minify --outfile=shuggle
      - name: Smoke test
        run: |
          ./shuggle version
          ./shuggle help | head -5
          ./shuggle --data=/tmp/shuggle-smoke tokens list | head -3
      - name: Prepare folder (binary + launchers)
        run: |
          mkdir -p bundle
          cp shuggle bundle/
          cp launcher/shuggle.sh bundle/
          cp launcher/shuggle-lan.sh bundle/
          chmod +x bundle/*.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuggle-linux-x64
          path: bundle/
          compression-level: 9

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test tests/core.test.ts tests/engine.test.ts
      - name: Bundle UI
        run: bun run build:ui
      # Console subsystem on purpose: the CLI modes (cli / chat / tokens)
      # print to the terminal. In window mode the app hides its console at
      # runtime, so there is no black cmd box behind the window.
      - name: Compile single binary
        shell: bash
        run: bun build src/shuggle.ts --compile --minify --windows-icon=assets/shuggle.ico --windows-title="Shuggle" --windows-publisher="HAKORA" --windows-version="0.5.0.0" --windows-description="Free chats on free GPUs" --outfile=Shuggle.exe
      - name: Smoke test
        shell: bash
        run: |
          ./Shuggle.exe version
          ./Shuggle.exe help | head -5
      - name: Prepare folder (exe + launchers)
        shell: bash
        run: |
          mkdir -p bundle
          cp Shuggle.exe bundle/
          cp launcher/"Shuggle.bat" bundle/
          cp launcher/"Shuggle CLI.bat" bundle/
          cp launcher/"Shuggle Ask.bat" bundle/
          cp launcher/"Shuggle LAN.bat" bundle/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuggle-windows-x64
          path: bundle/
          compression-level: 9
